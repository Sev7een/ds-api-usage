name: update-pricing

on:
  schedule:
    # daily at 06:23 UTC — DeepSeek adjusts list prices rarely, but a daily
    # check keeps the estimate table within ~24 h of any change
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  check-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pricing pages and update src/index.js
        id: fetch
        run: |
          node .github/scripts/update-pricing.mjs --apply
          if git status --porcelain -- src/index.js | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open pull request when prices changed
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/update-pricing-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/index.js
          git commit -m "chore: update pricing table from DeepSeek docs

          Regenerated by .github/scripts/update-pricing.mjs on $(date -u +%Y-%m-%dT%H:%MZ) from the official DeepSeek pricing page; parser validations passed."
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --fill
